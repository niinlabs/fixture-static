<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d10" />
    <meta
      name="description"
      content="A deliberately worthless page proving that the machinery works."
    />
    <title>The Fixture Static</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4f1e8;
        --muted: #9a9995;
        --line: rgba(244, 241, 232, 0.13);
        --signal: #d7ff58;
        --surface: #0c0d10;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--surface);
      }

      body {
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 82% 15%, rgba(255, 112, 40, 0.16), transparent 24rem),
          radial-gradient(circle at 15% 90%, rgba(220, 35, 35, 0.15), transparent 28rem),
          var(--surface);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.35;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: clamp(48px, 6vw, 88px) clamp(48px, 6vw, 88px);
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      .frame {
        position: relative;
        display: grid;
        min-height: 100svh;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1.25rem, 3vw, 2.75rem);
      }

      .topline,
      .baseline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        color: var(--ink);
      }

      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: 0 0 1.25rem rgba(215, 255, 88, 0.72);
        animation: breathe 3.8s ease-in-out infinite;
      }

      main {
        display: grid;
        align-content: center;
        width: min(100%, 92rem);
        margin: auto;
        padding-block: 4rem;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: var(--signal);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(0.68rem, 0.8vw, 0.8rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(4rem, 12vw, 11rem);
        font-weight: 530;
        letter-spacing: -0.075em;
        line-height: 0.78;
      }

      h1 em {
        color: transparent;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        letter-spacing: -0.055em;
        -webkit-text-stroke: 1px rgba(244, 241, 232, 0.68);
      }

      .statement {
        display: grid;
        grid-template-columns: 1fr minmax(16rem, 29rem);
        gap: 2rem;
        align-items: end;
        margin-top: clamp(2.5rem, 6vw, 6rem);
        border-top: 1px solid var(--line);
        padding-top: 1.4rem;
      }

      .statement p {
        grid-column: 2;
        margin: 0;
        color: #c4c2bc;
        font-size: clamp(1rem, 1.5vw, 1.3rem);
        line-height: 1.55;
      }

      .statement strong {
        color: var(--ink);
        font-weight: 520;
      }

      .baseline {
        padding-top: 1rem;
        border-top: 1px solid var(--line);
      }

      .nothing {
        color: var(--ink);
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.48; transform: scale(0.82); }
        50% { opacity: 1; transform: scale(1); }
      }

      @media (max-width: 620px) {
        .frame { padding: 1.25rem; }
        .topline > span:last-child { display: none; }
        h1 { font-size: clamp(4.2rem, 22vw, 7rem); }
        .statement { grid-template-columns: 1fr; }
        .statement p { grid-column: 1; max-width: 31rem; }
        .baseline > span:first-child { display: none; }
        .baseline { justify-content: flex-end; }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header class="topline">
        <span class="mark"><span class="dot" aria-hidden="true"></span>Operational</span>
        <span>Static fixture / 01</span>
      </header>

      <main>
        <p class="eyebrow">A controlled stand-in</p>
        <h1>Proof of <em>nothing.</em></h1>
        <div class="statement">
          <p>
            This page has no product, no purpose, and no ambition.
            <strong>Its presence is the entire result.</strong>
          </p>
        </div>
      </main>

      <footer class="baseline">
        <span>No input required</span>
        <span class="nothing">Everything is working.</span>
      </footer>
    </div>
  </body>
</html>
